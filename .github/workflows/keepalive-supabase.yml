# Evita que Supabase pause el proyecto por inactividad (límite de 7 días en el
# plan gratuito). Si el proyecto se pausa, pg_cron deja de ejecutarse y con él
# las alertas de stock (R12) y el despublicado de novedades vencidas (R7).
name: Keep-alive de Supabase

on:
  schedule:
    # Cada 3 días, 12:00 UTC (07:00 en Iquitos). El cron de GitHub Actions puede
    # retrasarse cuando hay carga; cada 3 días deja margen frente al límite de 7.
    - cron: '0 12 */3 * *'
  workflow_dispatch:

# Este workflow no necesita ningún permiso sobre el repositorio.
permissions: {}

jobs:
  ping:
    name: Ping a la API REST
    runs-on: ubuntu-latest
    steps:
      # Se consulta `roles` con la llave anon. Tres motivos:
      #
      #  - NO se usa la raíz /rest/v1/: en el proyecto alojado devuelve el
      #    esquema OpenAPI completo y está restringida a la service_role
      #    ("Only the `service_role` API key can be used for this endpoint").
      #    Meter esa llave aquí seria poner un pase que salta toda la RLS
      #    dentro de un ping.
      #  - NO se usa /auth/v1/health: no toca la base, y lo que cuenta como
      #    actividad frente a la pausa por inactividad es consultar Postgres.
      #  - `roles` existe desde la migración 0003 y es un catálogo estable.
      #    anon no tiene política de lectura sobre ella, así que la respuesta
      #    es `[]` con 200 — pero PostgREST igual consulta la base para
      #    aplicar la RLS, que es justo lo que necesitamos.
      #
      # Cuando exista `configuracion_sitio` (migración 0005) se puede cambiar
      # por su grupo público, que además devolvería filas de verdad.
      - name: Consultar la API para evitar la pausa por inactividad
        env:
          URL: ${{ secrets.SUPABASE_URL }}
          LLAVE: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          # Deliberadamente SIN --fail: hace falta el cuerpo de la respuesta.
          # Cuando Supabase rechaza una llave contesta 401 con un mensaje que
          # explica por qué, y ese mensaje es lo único que distingue "llave
          # equivocada" de "llave legacy desactivada en el proyecto". El cuerpo
          # no contiene secretos, y GitHub enmascara igual los valores.
          respuesta=$(curl --silent --show-error \
            --write-out '\n%{http_code}' \
            "${URL%/}/rest/v1/roles?select=codigo&limit=1" \
            -H "apikey: ${LLAVE}")

          codigo=$(printf '%s' "$respuesta" | tail -n1)
          cuerpo=$(printf '%s' "$respuesta" | sed '$d')

          echo "Codigo HTTP: $codigo"

          case "$codigo" in 2*) exito=1 ;; *) exito=0 ;; esac
          if [ "$exito" = "1" ]; then
            echo "La API REST respondio correctamente. El proyecto sigue activo."
            exit 0
          fi

          echo "Respuesta de Supabase:"
          echo "$cuerpo"
          echo

          case "$codigo" in
            401)
              echo "La llave fue rechazada. Comprueba, en este orden:"
              echo "  1. Que SUPABASE_ANON_KEY sea la del proyecto correcto."
              echo "  2. Que no arrastre comillas, espacios ni un salto de linea final."
              echo "  3. Si el proyecto es reciente: que no sea una llave legacy"
              echo "     (eyJ...) con el sistema legacy desactivado. En ese caso"
              echo "     va la publishable (sb_publishable_...)."
              ;;
            404)
              echo "No encontrado. Puede ser la URL o la tabla:"
              echo "  - SUPABASE_URL debe ser https://<ref>.supabase.co, sin barra"
              echo "    final y sin /rest/v1 (el workflow ya lo anade)."
              echo "  - La tabla public.roles debe existir en el proyecto remoto."
              echo "    Si aun no aplicaste las migraciones: supabase db push."
              ;;
            000)
              echo "No hubo respuesta. Revisa que SUPABASE_URL incluya https://."
              ;;
          esac
          exit 1
