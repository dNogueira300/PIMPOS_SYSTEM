name: Validación Netlify en Linux

on:
  workflow_dispatch:
  push:
    branches: [feat/validacion-cloudflare]
    paths:
      - .github/workflows/netlify-validacion.yml
      - scripts/netlify/**

permissions:
  contents: read

concurrency:
  group: netlify-validacion-${{ github.ref }}
  cancel-in-progress: false

jobs:
  compatibilidad:
    name: Adaptador Netlify y flujos locales
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      NETLIFY_TELEMETRY_DISABLED: "1"
      HUSKY: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.3.4
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Verificar aislamiento y preparar copia
        run: |
          node --test scripts/netlify/aislamiento.test.mjs
          node scripts/netlify/preparar.mjs
      - name: Instalar dependencias congeladas de validación
        working-directory: .superpowers/validacion-netlify-ci/app
        run: pnpm install --frozen-lockfile
      - name: Instalar CLI aislado con lock congelado
        working-directory: .superpowers/validacion-netlify-ci/cli
        run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          version: 2.116.0
      - name: Iniciar base temporal del runner
        run: |
          sudo sysctl -w net.ipv4.ip_local_reserved_ports=54320-54329
          supabase start
      - name: Instalar Chromium
        working-directory: .superpowers/validacion-netlify-ci/app
        run: pnpm exec playwright install --with-deps chromium
      - name: Registrar los casos disponibles
        working-directory: .superpowers/validacion-netlify-ci/app
        run: node scripts/netlify/ejecutar.mjs pruebas --list
      - name: Compilar y probar funciones empaquetadas por Netlify
        id: pruebas
        working-directory: .superpowers/validacion-netlify-ci/app
        run: node scripts/netlify/ejecutar.mjs pruebas
      - name: Conservar evidencia sin secretos ni paquetes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netlify-linux-${{ github.run_id }}
          retention-days: 7
          include-hidden-files: true
          path: |
            .superpowers/validacion-netlify-ci/fuentes.json
            .superpowers/validacion-netlify-ci/versiones.json
            .superpowers/validacion-netlify-ci/build.log
            .superpowers/validacion-netlify-ci/serve.log
            .superpowers/validacion-netlify-ci/pruebas.log
            .superpowers/validacion-netlify-ci/app/playwright-report/
            .superpowers/validacion-netlify-ci/app/test-results/
      - name: Registrar resultado y límites
        if: always()
        run: |
          printf '### Validación local del adaptador Netlify\n\n' >> "$GITHUB_STEP_SUMMARY"
          printf 'Commit: `%s`. Resultado de la suite: **%s**.\n\n' "$GITHUB_SHA" '${{ steps.pruebas.outcome }}' >> "$GITHUB_STEP_SUMMARY"
          printf 'Supabase temporal y Netlify offline. No es una prueba del servicio remoto ni de consumo de créditos.\n' >> "$GITHUB_STEP_SUMMARY"
      - name: Apagar base temporal
        if: always()
        run: supabase stop --no-backup || true
